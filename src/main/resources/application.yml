spring:
  application:
    name: nutee-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
    path: /api/v1/api-docs
  swagger-ui:
    enabled: false
    path: /api/v1/swagger-ui.html

app:
  docs-enabled: false
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    from: ${MAIL_FROM:no-reply@nutee.local}
  security:
    cookies:
      secure: ${AUTH_SECURE_COOKIE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:}
      refresh-secret: ${JWT_REFRESH_SECRET:}
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
