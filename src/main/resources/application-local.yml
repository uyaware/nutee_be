spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutee}
    username: ${DB_USERNAME:nutee}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  seed:
    catalog-enabled: ${CATALOG_SEED_ENABLED:true}
  docs-enabled: true
  security:
    cookies:
      secure: ${AUTH_SECURE_COOKIE:false}
